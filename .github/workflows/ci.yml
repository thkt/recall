name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt -- --check

      - name: Install nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --profile ci --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  coverage:
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - name: Measure standard tests
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --no-report

      - name: Stage checksum-pinned public Gemma artifacts
        run: |
          target/llvm-cov-target/debug/recall model manifest > "$RUNNER_TEMP/gemma-manifest.json"
          python3 scripts/fetch-gemma-test-artifacts.py \
            "$RUNNER_TEMP/gemma-manifest.json" "$RUNNER_TEMP/gemma-public-model"

      - name: Measure public model inference contracts
        env:
          RECALL_GEMMA_TEST_ARTIFACT_DIR: ${{ runner.temp }}/gemma-public-model
          RECALL_MODEL_DIR: ${{ runner.temp }}/gemma-public-model
        run: |
          cargo llvm-cov --locked --no-report --bin recall -- \
            --ignored public_model_contract --test-threads=1

      - name: Measure public model CLI and probe contracts
        env:
          RECALL_GEMMA_TEST_ARTIFACT_DIR: ${{ runner.temp }}/gemma-public-model
        run: |
          cargo llvm-cov --locked --no-report --test gemma_cli -- \
            --ignored public_model_cli_contract --test-threads=1 --nocapture

      - name: Generate combined lcov coverage
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Test coverage filter script
        run: |
          python3 -m venv /tmp/pytest-venv
          /tmp/pytest-venv/bin/pip install --quiet pytest
          /tmp/pytest-venv/bin/python -m pytest .github/scripts/test_filter_lcov_cfg_test.py -q

      - name: Strip cfg(test) blocks from lcov via filter script
        run: |
          python3 .github/scripts/filter_lcov_cfg_test.py \
            lcov.info \
            lcov.filtered.info \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Diff coverage gate (changed lines >= 95%)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 -m venv /tmp/diff-cover-venv
          /tmp/diff-cover-venv/bin/pip install --quiet diff-cover
          /tmp/diff-cover-venv/bin/diff-cover lcov.filtered.info \
            --compare-branch=origin/main \
            --fail-under=95

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny,cargo-audit

      - name: Deny check
        run: cargo-deny check

      - name: Audit
        run: cargo-audit audit
