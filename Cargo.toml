[package]
name = "recall"
version = "0.13.0"
edition = "2024"
rust-version = "1.98.1"
description = "Full-text search CLI for past Claude Code and Codex sessions"
license = "MIT"
repository = "https://github.com/thkt/recall"

[dependencies]
anyhow = "1.0.102"
bytemuck = "1"
clap = { version = "4.6.1", features = ["derive", "env"] }
llama-cpp-2 = { path = "vendor/llama-cpp-2", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "=0.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Artifact downloads stream bytes; charset decoding is unnecessary. Retain the
# existing TLS, HTTP/2 and system proxy support.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "http2", "system-proxy"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# absolute paths
absolute_paths = "deny"
# idiomatic iterators
cast_possible_truncation = "deny"
redundant_closure_for_method_calls = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
manual_filter_map = "deny"
manual_find_map = "deny"
# imports
wildcard_imports = "deny"
enum_glob_use = "deny"
# strings
str_to_string = "deny"
# arguments
needless_pass_by_value = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
