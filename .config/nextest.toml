[profile.default]
fail-fast = false

[profile.ci]
fail-fast = false
# 120s × 2 = 4min hard ceiling per standard test. Public-model inference and CLI
# tests are opt-in and run separately in CI coverage; re-measure before changing this limit.
slow-timeout = { period = "120s", terminate-after = 2 }
final-status-level = "flaky"
